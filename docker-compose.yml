services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"

  api:
    build: .
    container_name: api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AWS_BUCKET_NAME=csar2g-objects
      - AWS_REGION=us-east-1
    depends_on:
      - redis
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs

  worker:
    build:
      context: .
      dockerfile: app/workers/Dockerfile
    environment:
      - REDIS_URL=redis://redis:6379/0
      - AWS_BUCKET_NAME=csar2g-objects
      - AWS_REGION=us-east-1
    depends_on:
      - redis
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    deploy:
      replicas: 3

volumes:
  uploads:
  outputs:
