<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador Multimedia</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <header>
        <h1>Procesador Multimedia</h1>
    </header>

    <main>
        <div class="tabs">
            <button class="tab active" data-tab="imagen">Imagen</button>
            <button class="tab" data-tab="video">Descarga de Video</button>
        </div>

			<div class="tab-content" id="imagen">
				<div class="dropzone" id="dropzone">
					<p>Arrastra tu imagen aquí</p>
					<p>o</p>
					<button type="button" class="btn-secondary" onclick="document.getElementById('img-archivo').click()">Seleccionar archivo</button>
					<input type="file" id="img-archivo" accept="image/*" style="display:none" />
					<p id="nombre-archivo"></p>
				</div>

				<div class="preview" id="img-preview" style="display:none">
					<img id="img-preview-src" src="" alt="Preview" />
				</div>

				<div class="form-group">
					<label>Operación</label>
					<select id="img-operacion">
						<option value="">-- Selecciona --</option>
						<option value="convertir">Convertir formato</option>
						<option value="resize">Redimensionar</option>
						<option value="filtro">Aplicar filtro</option>
					</select>
				</div>

				<div id="opts-convertir" class="hidden">
					<div class="form-group">
						<label>Formato destino</label>
						<select id="img-formato">
							<option value="png">PNG</option>
							<option value="jpg">JPG</option>
							<option value="jpeg">JPEG</option>
							<option value="webp">WebP</option>
						</select>
					</div>
				</div>

				<div id="opts-resize" class="hidden">
					<div class="form-row">
						<div class="form-group">
							<label>Ancho (px)</label>
							<input type="number" id="img-ancho" placeholder="800" />
						</div>
						<div class="form-group">
							<label>Alto (px)</label>
							<input type="number" id="img-alto" placeholder="600" />
						</div>
					</div>
				</div>

				<div id="opts-filtro" class="hidden">
					<div class="form-group">
						<label>Filtro</label>
						<select id="img-filtro">
							<option value="grayscale">Escala de grises</option>
							<option value="blur">Desenfoque</option>
							<option value="sharpen">Afilar</option>
							<option value="sepia">Sepia</option>
						</select>
					</div>
				</div>

				<button class="btn" id="btn-imagen">Procesar imagen</button>
			</div>

			<div class="tab-content hidden" id="video">
				<div class="form-group">
					<label>URL de YouTube</label>
					<input type="url" id="yt-url" placeholder="https://www.youtube.com/watch?v=..." />
				</div>

				<div class="preview" id="yt-preview" style="display:none">
					<img id="yt-preview-src" src="" alt="Miniatura" />
				</div>

				<div class="form-group">
					<label>Formato</label>
					<select id="yt-formato">
						<option value="mp4">MP4 (video)</option>
						<option value="mp3">MP3 (solo audio)</option>
					</select>
				</div>

				<button class="btn" id="btn-youtube">Descargar</button>
			</div>

        <section id="tareas">
            <!-- tarjetas de tareas aquí -->
        </section>
    </main>

    <script src="static/js/app.js"></script>
</body>
</html>
